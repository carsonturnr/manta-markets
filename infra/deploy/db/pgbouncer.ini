; Manta (2026-11-27): the site reaches Postgres only through here, over TLS, as one of the three
; logins in userlist.txt (SCRAM verifiers copied from pg_authid: refresh it when a password changes).
; The jobs and the admin are not listed, so they cannot log in from the network.
[databases]
manta = host=/var/run/postgresql dbname=manta

[pgbouncer]
listen_addr = *
listen_port = 6432
unix_socket_dir = /var/run/postgresql
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
; Transaction mode: a server connection is held only for one transaction, so Vercel functions that
; freeze with an idle connection don't keep a database connection busy (the 2026-11-26 failure).
pool_mode = transaction
max_client_conn = 300
default_pool_size = 10
; postgres.js uses prepared statements; PgBouncer tracks them across server connections.
max_prepared_statements = 200
client_tls_sslmode = require
client_tls_key_file = /etc/pgbouncer/server.key
client_tls_cert_file = /etc/pgbouncer/server.crt
logfile = /var/log/postgresql/pgbouncer.log
pidfile = /var/run/postgresql/pgbouncer.pid
