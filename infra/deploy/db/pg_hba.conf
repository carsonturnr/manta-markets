# Manta (2026-11-27). postgres: Unix peer only (sudo -u postgres). Everyone else: scram-sha-256, and
# TCP only with TLS (hostssl): there are no plain "host" lines, so an unencrypted TCP login is refused.
local   all  postgres                 peer
local   all  all                      scram-sha-256
hostssl all  all       127.0.0.1/32   scram-sha-256
hostssl all  all       ::1/128        scram-sha-256
