<!DOCTYPE html>
<!-- LinkedIn Featured card (1200 × 627) and og:image (1200 × 630): the same page, rendered at both
     viewport heights. Colours are site/app/globals.css tokens; fonts are the next/font families in
     site/app/layout.tsx, from the same Google Fonts source; the mark is site/components/Mark.tsx.
     terminal-tape.png is a 2x crop of the live /terminal Trades panel (mantamarkets.com,
     2026-11-23 15:25 UTC): real UI, nothing invented. Render (from this folder):
       npx playwright screenshot --viewport-size=1200,627 --wait-for-timeout=1500 file://$PWD/linkedin-header.html linkedin-header.png -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Manta: a terminal for prediction markets</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist&family=Geist+Mono&family=Newsreader:wght@400&display=block"
    />
    <style>
      :root {
        --bg: #000000;
        --line: rgba(255, 255, 255, 0.08);
        --rail: rgba(255, 255, 255, 0.1);
        --text: #f2f2f2;
        --text-2: #9a9a9a;
        --mint: #00ff77;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 100vh; /* 627 for LinkedIn, 630 for og:image */
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: "Geist", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* The site's dashed rails, placed on the 60 px safe-area margins. */
      .frame {
        position: absolute;
        inset: 0 60px;
        border-left: 1px dashed var(--rail);
        border-right: 1px dashed var(--rail);
      }
      /* Everything that matters sits in the centred 1080 × 510 safe area. */
      .safe {
        position: absolute;
        left: 60px;
        right: 60px;
        top: calc(50vh - 255px);
        height: 510px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 8px 0 4px 48px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.22em;
        font-family: "Newsreader", Georgia, serif;
        font-size: 44px;
        letter-spacing: -0.03em;
      }
      h1 {
        font-family: "Newsreader", Georgia, serif;
        font-weight: 400;
        font-size: 92px;
        line-height: 0.98;
        letter-spacing: -0.04em;
        max-width: 600px;
      }
      .domain {
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 24px;
        letter-spacing: 0.02em;
        color: var(--mint);
      }
      /* The real Trades panel, bleeding off the bottom and fading into the black. */
      .ui {
        position: absolute;
        right: 108px;
        top: calc(50vh - 255px + 8px);
        width: 380px;
        border: 1px solid var(--line);
        border-bottom: 0;
        -webkit-mask-image: linear-gradient(to bottom, #000 55%, transparent 100%);
      }
      .ui img {
        display: block;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="frame"></div>
    <div class="ui"><img src="terminal-tape.png" alt="" /></div>
    <div class="safe">
      <div class="brand">
        <svg width="1.3em" height="0.89em" viewBox="0 7.5 48 33" aria-hidden="true">
          <path
            fill="currentColor"

          />
        </svg>
        Manta
      </div>
      <h1>A terminal for prediction markets.</h1>
      <div class="domain">mantamarkets.com</div>
    </div>
  </body>
</html>
