[project]
name = "manta-backtest"
version = "0.1.0"
description = "Milestone 4: Manta's market maker on NautilusTrader, replayed against recorded data"
requires-python = ">=3.13"
dependencies = [
    # Exact pin: a release candidate, and the first release with the Kalshi adapter.
    "nautilus_trader==2.0.0rc9",
    "manta-pricing",
    "pyarrow>=26.0.1",
]

[tool.uv.sources]
manta-pricing = { path = "../pricing", editable = true }

[project.scripts]
manta-catalog = "manta_backtest.catalog:main"
manta-catalog-check = "manta_backtest.check:main"
manta-fair-series = "manta_backtest.fairseries:main"
manta-queue = "manta_backtest.queue:main"
manta-queue-report = "manta_backtest.queue:report_main"
manta-fair-predict = "manta_backtest.predict:main"
manta-mm-probe = "manta_backtest.strategy:probe_main"
manta-mm-backtest = "manta_backtest.strategy:backtest_main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manta_backtest"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
