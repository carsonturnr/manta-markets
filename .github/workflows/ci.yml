name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  recorder:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: recorder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: recorder/go.mod
          cache-dependency-path: recorder/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
