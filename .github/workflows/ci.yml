name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  recorder:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: recorder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: recorder/go.mod
          cache-dependency-path: recorder/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...

  pricing:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: pricing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -q

  # No secrets: the tests are pure (lib/*.test.ts never import ./db), and pages read the database
  # only at request time.
  site:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # runs the .ts tests directly (type stripping)
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx next typegen && npx tsc --noEmit
      - run: npm run lint
      - run: npm test
