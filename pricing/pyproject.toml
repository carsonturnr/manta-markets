[project]
name = "manta-pricing"
version = "0.1.0"
description = "Fair values for Kalshi's Bitcoin contracts from Deribit option prices"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.3.9",
]

[project.scripts]
manta-fair = "manta_pricing.table:main"
manta-snap = "manta_pricing.snapshot:main"
manta-quality = "manta_pricing.quality:main"
manta-contracts = "manta_pricing.contracts:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manta_pricing"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
